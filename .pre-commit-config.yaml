repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 'v0.0.263'
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-fast
        entry: pytest tests/ -m "not slow" -v
        language: system
        pass_filenames: false
        always_run: true

      - id: test-coverage
        name: test-coverage
        entry: pytest tests/ --cov=agent_security --cov-report=term-missing:skip-covered -v --cov-fail-under=90
        language: system
        pass_filenames: false
        always_run: false
        stages: [push] 