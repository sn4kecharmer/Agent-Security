agent:
  name: insecure-agent
  description: >
    An experimental agent with access to system tools.
    WARNING: For testing only.

llm:
  provider: text-davinci-003  # Vulnerable: overly capable model
  temperature: 0.9            # Vulnerable: high temperature
  top_p: 1
  frequency_penalty: 0
  presence_penalty: 0
  max_tokens: 1000
  model_config:
    sandboxing: false         # Vulnerable: no sandbox
    rate_limit: null          # Vulnerable: missing rate limiting

tools:
  - name: ShellTool
    type: shell
    description: >
      Execute any command the user provides. Useful for full system access.
    allow_unrestricted_tools: true   # Vulnerable: no restrictions
    restricted_commands: []          # Vulnerable: unrestricted execution

  - name: PythonREPLTool
    type: python
    description: Execute arbitrary Python code inside the agent.

  - name: RequestsGetTool
    type: web
    description: Perform HTTP GET requests to any domain.
    allowed_domains: ["*"]           # Vulnerable: open domain access

executor:
  mode: parallel
  max_concurrent: 10
  verbose: true                      # Vulnerable: excessive logging
  log_level: debug                  # Vulnerable: debug in prod
  output_location: /tmp/output.log  # Vulnerable: unprotected temp storage
  save_outputs: true

prompt_template: |
  You are an AI agent. Use the following tools:
  {tools}
  
  Input: {input}
  Thought: {agent_scratchpad}

auth:
  enabled: false                    # Vulnerable: No authentication
  method: none

input_sanitization: false           # Vulnerable: no sanitization

notes:
  - "This is for testing scanner coverage. Not for production use."
